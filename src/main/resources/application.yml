spring:
  datasource:

    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties.hibernate.format_sql: true

  logging:
    level:
      org.hibernate.orm.boot: TRACE

  data:
    redis:
      host: localhost
      port: 6379